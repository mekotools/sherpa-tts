# MekoTools: Vorlesen — Stapel fuer flip
#
# Ablage auf dem Zielhost: /poolio/docker/mekotools-sherpa-tts/docker-compose.yml
# Start:  cd /poolio/docker/mekotools-sherpa-tts && docker compose up -d
#
# Feste Fassung: das Abbild wird ueber seinen Inhaltswert (Digest) festgenagelt,
# nicht ueber :latest — ein neuer Bau aendert das laufende Werkzeug dann nicht
# von selbst.
#
# Dienst: nginx liefert die statische Seite aus, Port 80 im Behaelter.
# Keine Datenablage, keine Geheimnisse, keine Umgebungsvariablen.

services:
  web:
    image: ghcr.io/mekotools/sherpa-tts@sha256:c467a329f3c9de2e8d0f8bb17ace27b1b9925b95bb66685eb938f5975bb7abfe
    container_name: mekotools-sherpa-tts
    restart: unless-stopped
    networks: [coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.mekotools-sherpa-tts.rule=Host(`sherpa-tts.mekotools.de`)
      - traefik.http.routers.mekotools-sherpa-tts.entrypoints=http
      - traefik.http.services.mekotools-sherpa-tts.loadbalancer.server.port=80

networks:
  coolify:
    external: true
