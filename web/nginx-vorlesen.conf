# Kopfzeilen für Vorlesen (MekoTools)
#
# Warum das nötig war: ohne jede Vorgabe holte der Browser Rechenkern und Stimme
# bei jedem Aufruf neu — gemessen 108 MB und 25 s Wartezeit je Aufruf.
#
# Die Stimmen tragen jetzt die Prüfsumme im Dateinamen (stimmen/stimmen_manifest.py),
# ändern sich also nie unter gleichem Namen: ein Jahr unveränderlich zwischenspeichern.
# Der Rechenkern ändert sich mit jedem Bau, deshalb "no-cache" (jedes Mal
# rückfragen). Den Zwischenspeicher übernimmt der Service Worker; er trägt die
# Fassung im Namen und räumt alte Stände selbst weg.
# Die kleinen Textdateien ebenfalls "no-cache": Änderungen sollen sofort ankommen.

location ~ ^/stimmen/[a-zA-Z0-9_]+-[0-9a-f]{8}\.onnx$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~ ^/(sherpa-onnx-wasm-main-tts\.(js|wasm|data)|sherpa-onnx-tts\.js|sherpa-onnx-tts\.worker\.js|index\.html|vorlesen\.js|service-worker\.js|stimmen/stimmen\.json)$ {
    add_header Cache-Control "no-cache";
}

# Übertragung verkleinern (der Rechenkern ist 14 MB, die Grunddaten 3 MB).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/wasm;
