# Vorlesen (MekoTools) — ersetzt die Vorgabe-Serverdatei des Abbilds.
#
# Warum als ganze Server-Datei und nicht als Bruchstück: die Dateien unter conf.d/
# werden im http-Zusammenhang eingelesen, dort ist "location" nicht erlaubt.
# Genau daran ist der erste Auslieferversuch gescheitert — der Behälter startete
# in einer Schleife: "location directive is not allowed here". Der Bau prüft die
# Konfiguration jetzt mit "nginx -t"; ein solcher Fehler fällt damit beim Bau auf
# und nicht erst beim Ausliefern.
#
# Warum die Kopfzeilen: ohne jede Vorgabe holte der Browser Rechenkern und Stimme
# bei jedem Aufruf neu (gemessen 108 MB, 25 s). Die Stimmen tragen die Prüfsumme
# im Dateinamen (stimmen/stimmen_manifest.py), ändern sich also nie unter
# gleichem Namen: ein Jahr unveränderlich. Der Rechenkern ändert sich mit jedem
# Bau, deshalb "no-cache" (jedes Mal rückfragen); den Zwischenspeicher übernimmt
# der Service Worker, der die Fassung im Namen trägt und alte Stände wegräumt.
# Die kleinen Textdateien ebenfalls "no-cache": Änderungen sollen sofort ankommen.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    location ~ ^/stimmen/[a-zA-Z0-9_]+-[0-9a-f]{8}\.onnx$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/(sherpa-onnx-wasm-main-tts\.(js|wasm|data)|sherpa-onnx-tts\.js|sherpa-onnx-tts\.worker\.js|index\.html|vorlesen\.js|service-worker\.js|stimmen/stimmen\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Übertragung verkleinern (der Rechenkern ist 14 MB, die Grunddaten 3 MB).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm;
}
