name: Abbild bauen und nach GHCR schieben (Spiegel)

# Der Lauf in diesem Repo legt das Paket in GHCR an: nur ein Arbeitsablauf
# INNERHALB eines oeffentlichen Repos erzeugt ein oeffentlich ziehbares Paket.
# Ein Paket, das ein fremder Laeufer zuerst schiebt, bleibt privat und laesst
# sich ueber die Schnittstelle nicht mehr umstellen.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  abbild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quelle holen
        uses: actions/checkout@v4

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/mekotools/sherpa-tts:latest
            ghcr.io/mekotools/sherpa-tts:sha-${{ github.sha }}

      - name: Sichtbarkeit nachsehen
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/mekotools/packages/container/sherpa-tts" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('repository') or {}; print('Sichtbarkeit:', d.get('visibility'), '| verknuepft:', r.get('full_name'))"
