name: Abbild bauen

# Baut das fertige Abbild und legt es in der Registry ab. Der Lauf uebersetzt
# sherpa-onnx mit emscripten; die Aussprachedaten kommen aus einem kleinen
# amtlichen Modellpaket. Die vier Vorlese-Stimmen holt der Bau NICHT mehr: sie
# sind zusammen 89 MB und werden vom VPS ausgeliefert (Repo mekotools-modelle,
# das sie vom amtlichen Release holt und gegen die eingecheckte Liste prueft).
# Weil der Lauf INNERHALB dieses oeffentlichen Repos schiebt, entsteht das Paket
# in GHCR oeffentlich und ist anonym ziehbar.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Bauwerkzeug einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mekotools/sherpa-tts:latest
            ghcr.io/mekotools/sherpa-tts:${{ github.sha }}

      - name: Kennwerte melden
        run: |
          echo "Gebaut: ghcr.io/mekotools/sherpa-tts:${{ github.sha }}"
          docker buildx imagetools inspect ghcr.io/mekotools/sherpa-tts:latest || true

      - name: Sichtbarkeit des Pakets nachsehen
        # Die Sichtbarkeit eines Pakets laesst sich NICHT ueber die Schnittstelle
        # aendern — es gibt fuer Pakete einer Organisation keinen solchen Endpunkt
        # (Abrufen, Loeschen, Wiederherstellen, Fassungen: ja; Aendern: nein).
        # Das Paket entsteht beim ersten Schieben daher privat und wird einmalig
        # im Web auf oeffentlich gestellt:
        #   https://github.com/orgs/mekotools/packages/container/sherpa-tts/settings
        #   -> Danger Zone -> Change visibility -> Public
        # Danach bleibt es bei weiteren Bauvorgaengen oeffentlich. Der Schritt
        # unten scheitert bewusst NICHT, sondern meldet nur den Ist-Zustand.
        env:
          KENNUNG: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          S=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $KENNUNG" \
            "https://api.github.com/orgs/mekotools/packages/container/sherpa-tts" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('visibility'))" 2>/dev/null || echo "unbekannt")
          echo "Sichtbarkeit des Pakets: $S"
          if [ "$S" != "public" ]; then
            echo "::warning::Paket ist nicht oeffentlich. Einmalig umstellen: https://github.com/orgs/mekotools/packages/container/sherpa-tts/settings"
          fi
          TOK=$(curl -s "https://ghcr.io/token?scope=repository:mekotools/sherpa-tts:pull&service=ghcr.io" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          A=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            https://ghcr.io/v2/mekotools/sherpa-tts/manifests/latest)
          echo "Anonymer Abruf des Pakets: $A (200 = jeder kann es ziehen)"
