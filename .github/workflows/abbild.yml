name: Abbild bauen

# Baut das fertige Abbild und legt es in der Registry ab. Der Lauf holt zur
# Bauzeit die amtliche Stimme (Modell-Release tts-models) und uebersetzt
# sherpa-onnx mit emscripten; die Stimme wird dabei in die WebAssembly-Datei
# eingebettet. Weil der Lauf INNERHALB dieses oeffentlichen Repos schiebt,
# entsteht das Paket in GHCR oeffentlich und ist anonym ziehbar.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Bauwerkzeug einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mekotools/sherpa-tts:latest
            ghcr.io/mekotools/sherpa-tts:${{ github.sha }}

      - name: Kennwerte melden
        run: |
          echo "Gebaut: ghcr.io/mekotools/sherpa-tts:${{ github.sha }}"
          docker buildx imagetools inspect ghcr.io/mekotools/sherpa-tts:latest || true

      - name: Sichtbarkeit oeffentlich stellen und nachsehen
        env:
          KENNUNG: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          CODE=$(curl -sS -o /tmp/antwort.json -w '%{http_code}' -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $KENNUNG" \
            -d '{"visibility":"public"}' \
            "https://api.github.com/orgs/mekotools/packages/container/sherpa-tts")
          echo "Antwortcode der Sichtbarkeitsaenderung: $CODE"
          cat /tmp/antwort.json; echo
          curl -s -H "Authorization: token $KENNUNG" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/mekotools/packages/container/sherpa-tts" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('Sichtbarkeit jetzt:', d.get('visibility'))"
